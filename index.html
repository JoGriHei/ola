<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Olá!">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>Olá! Portugiesisch für Kinder</title>
<link href="vendor/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --bg:#eef4ff; --bg2:#dfe9fb; --surface:#ffffff; --ink:#0f1f4d; --muted:#51608a;
  --blue:#1746a2; --blue-d:#0f2f73; --on-blue:#ffffff;
  --sun:#ffc928; --sun-d:#c79300; --on-sun:#2b2000;
  --sea:#12916f; --ok-bg:#d9f5ea; --bad:#d63b45; --bad-bg:#fde3e4;
  --line:#c5d3ef; --tile:#f7faff;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Avenir Next","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0b1533; --bg2:#101e45; --surface:#16265a; --ink:#f2f5ff; --muted:#a9b6dc;
    --blue:#7fa8ff; --blue-d:#4c78d6; --on-blue:#081231;
    --sun:#ffc928; --sun-d:#a87c00; --on-sun:#2b2000;
    --sea:#45cfa5; --ok-bg:#123b33; --bad:#ff7a82; --bad-bg:#44202a;
    --line:#2a3d7a; --tile:#1b2d66;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b1533; --bg2:#101e45; --surface:#16265a; --ink:#f2f5ff; --muted:#a9b6dc;
  --blue:#7fa8ff; --blue-d:#4c78d6; --on-blue:#081231;
  --sun:#ffc928; --sun-d:#a87c00; --on-sun:#2b2000;
  --sea:#45cfa5; --ok-bg:#123b33; --bad:#ff7a82; --bad-bg:#44202a;
  --line:#2a3d7a; --tile:#1b2d66;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 1.125rem/1.45 var(--body);
  background-image:
    radial-gradient(circle at 50% 50%, var(--bg2) 0 7px, transparent 8px),
    radial-gradient(circle at 0 0, var(--bg2) 0 14px, transparent 15px),
    radial-gradient(circle at 100% 0, var(--bg2) 0 14px, transparent 15px),
    radial-gradient(circle at 0 100%, var(--bg2) 0 14px, transparent 15px),
    radial-gradient(circle at 100% 100%, var(--bg2) 0 14px, transparent 15px);
  background-size:72px 72px;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
#app{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
h1{font-size:2.6rem;font-weight:800}
h2{font-size:1.9rem;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

/* Buttons: dicke Unterkante, damit sie sich „drücken“ lassen */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  min-height:60px;padding:.5em 1.3em;border-radius:18px;
  font-family:var(--display);font-weight:800;font-size:1.35rem;
  background:var(--blue);color:var(--on-blue);box-shadow:0 6px 0 var(--blue-d);
  transition:transform .06s, box-shadow .06s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blue-d)}
.btn.sun{background:var(--sun);color:var(--on-sun);box-shadow:0 6px 0 var(--sun-d)}
.btn.sun:active{box-shadow:0 2px 0 var(--sun-d)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 6px 0 var(--line);border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 2px 0 var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.round{
  width:60px;height:60px;border-radius:50%;display:inline-grid;place-items:center;font-size:1.6rem;
  background:var(--surface);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);flex:none;
}
.round:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.round.on{background:var(--sun);border-color:var(--sun-d);box-shadow:0 5px 0 var(--sun-d)}
.round.big{width:96px;height:96px;font-size:2.6rem;background:var(--blue);border-color:var(--blue-d);box-shadow:0 7px 0 var(--blue-d)}

/* Kachel = Azulejo */
.tile{
  position:relative;background:var(--tile);border:3px solid var(--blue);border-radius:14px;
  box-shadow:inset 0 0 0 5px var(--tile), inset 0 0 0 7px var(--line), 0 6px 0 var(--blue-d);
}
button.tile{display:block;width:100%;text-align:left;transition:transform .06s, box-shadow .06s}
button.tile.act{display:flex}
button.tile.opt{display:grid}
button.tile:active{transform:translateY(4px);box-shadow:inset 0 0 0 5px var(--tile), inset 0 0 0 7px var(--line), 0 2px 0 var(--blue-d)}

.bar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.bar .grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:.3em;padding:.25em .8em;border-radius:99px;background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-weight:800;font-size:1.2rem}

/* Start */
.hero{text-align:center;padding:26px 0 10px}
.hero svg{width:190px;height:auto}
.hero h1{font-size:3.6rem;color:var(--blue)}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin:26px 0}
.who .tile{text-align:center;padding:22px 10px 18px}
.who .ava{font-size:4rem;line-height:1;height:96px;display:grid;place-items:center;margin-bottom:6px}
.who .pf{position:relative}
.who .pf .tile{width:100%}
.who .edit{position:absolute;top:8px;right:8px;width:48px;height:48px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-size:1.4rem}
.ava-img{width:1.25em;height:1.25em;border-radius:50%;object-fit:cover;display:inline-block;vertical-align:middle;background:#fff}
.who .ava .ava-img{width:96px;height:96px}
.chip .ava-img{width:1.6em;height:1.6em;margin:-.3em 0}
.avas button .ava-img{width:58px;height:58px}
.who .nm{font-family:var(--display);font-weight:800;font-size:1.5rem;display:block;overflow-wrap:anywhere}
details.parents{margin-top:34px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1rem}
details.parents summary{font-weight:700;cursor:pointer}
details.parents section{border-top:1px solid var(--line);padding:12px 0 6px}
details.parents summary + section{margin-top:10px}
details.parents h3{margin:0 0 4px;font-size:1.05rem}
details.parents p{margin:0 0 8px}
details.parents .pbtns{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
details.parents .pbtns .btn{margin:0;font-size:1rem;padding:.45em 1em;min-height:0}
details.parents .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.link{color:var(--bad);font-weight:700;text-decoration:underline;min-height:44px;padding:0 6px}

/* Profil anlegen */
.form label{display:block;font-family:var(--display);font-weight:800;font-size:1.3rem;margin:22px 0 8px}
.form input[type=text]{width:100%;font:inherit;font-size:1.4rem;padding:.6em .8em;border-radius:14px;border:3px solid var(--line);background:var(--surface);color:var(--ink)}
.avas{display:flex;flex-wrap:wrap;gap:10px}
.avas button{width:68px;height:68px;font-size:2.3rem;border-radius:16px;background:var(--surface);border:3px solid var(--line)}
.avas button.sel{border-color:var(--blue);background:var(--sun)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modes button{padding:16px 12px;border-radius:16px;background:var(--surface);border:3px solid var(--line);text-align:center}
.modes button.sel{border-color:var(--blue);background:var(--sun);color:var(--on-sun)}
.modes .big{font-size:2.4rem;display:block}
.modes b{font-family:var(--display);font-size:1.25rem;display:block}
.modes small{font-size:.95rem}

/* Übersicht */
.review{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:22px;border-radius:18px;background:var(--sun);color:var(--on-sun);box-shadow:0 6px 0 var(--sun-d);width:100%;text-align:left}
.review:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-d)}
.review{position:relative;padding:20px 22px;font-size:1.1rem;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.review .big{font-size:3.2rem}
.review .txt{flex:1}
.review .cnt{font-family:var(--display);font-size:2.4rem;font-weight:800;background:#fff;color:#0f1f4d;border-radius:999px;min-width:64px;height:64px;display:flex;align-items:center;justify-content:center;padding:0 12px}
.review .bonus{position:absolute;top:-12px;right:14px;background:#0f1f4d;color:#fff;font-weight:800;border-radius:999px;padding:4px 10px;font-size:.95rem}
.review b{font-family:var(--display);font-size:1.5rem;display:block;line-height:1.1}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.tile.lesson{padding:22px 18px 18px;text-align:center}
.lesson .ico{font-size:4rem;line-height:1;display:block;margin-bottom:10px}
.icon-img{width:1.25em;height:1.25em;object-fit:contain;vertical-align:middle;display:inline-block}
.lesson .ico .icon-img,.station .ico .icon-img{width:96px;height:96px;border-radius:18px}
.lesson .cnt{display:block;margin-top:6px;font-weight:700;color:var(--muted);font-size:1rem}
.lesson.full{border-color:var(--sea)}
/* Deutsche Übersetzung nur nach Tippen auf 🇩🇪 */
body:not(.de-on) .de,body:not(.de-on) .debig,body:not(.de-on) .dei{display:none}
.lesson .pt{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.1;display:block;color:var(--blue)}
.lesson .de{display:block;color:var(--muted)}
.lesson .nr{position:absolute;top:14px;right:16px;font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--muted)}
/* Lernpfad: Stationen als Kacheln mit Fortschritt */
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin:16px 0 24px}
.station{padding:14px 10px 12px;text-align:center;position:relative}
.station .ico{font-size:3rem;line-height:1;display:block}
.station.extra .extitle{display:block;text-align:center;font-family:var(--display);font-weight:800;font-size:1.1rem;margin-top:6px}
.station.extra .de{font-size:.85rem}
.station .nr{position:absolute;top:8px;left:12px;font-family:var(--display);font-weight:800;color:var(--muted)}
.station .parts{display:flex;justify-content:center;gap:8px;margin-top:8px;font-size:1.3rem}
.station .parts i{font-style:normal;opacity:.3;filter:grayscale(1)}
.station .parts i.on{opacity:1;filter:none}
.station.now{border-color:var(--blue);background:var(--sun);color:var(--on-sun)}
.station.full{border-color:var(--sea)}
.station .meter{margin-top:10px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:16px}
.album .alb{background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:10px;text-align:center}
.album .alb img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
.album .alb.locked .ph{font-size:4.5rem;line-height:1;aspect-ratio:1;display:grid;place-items:center;filter:grayscale(1) brightness(1.6);opacity:.35}
.album .alb small .icon-img{width:40px;height:40px}
.album .alb small{display:block;font-weight:700;color:var(--muted);margin-top:4px}
.newfish img{width:min(260px,70vw);display:block;margin:6px auto 0}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;margin-top:16px}
.tile.gtile{padding:18px 12px 14px;text-align:center}
.gtile .ico{font-size:3.6rem;line-height:1;display:block}
.games.over .gtile{opacity:.45;filter:grayscale(.6)}
.timeup{margin:6px 0 20px;padding:18px;border-radius:20px;background:#fff6d6;border:3px solid #f2c94c;text-align:center;font-size:1.1rem}
.timeup .big{display:block;font-size:3.4rem;line-height:1.1}
.timeup .de{display:block}.timeup .btn{display:block;margin:12px auto 0}
.gimg{height:1.5em;width:auto;vertical-align:middle;display:inline-block;margin:-.15em 0;border-radius:16px}.gimg.sm{border-radius:8px}.gimg.sm{height:1.3em;margin-top:-.2em}
.gtile .pt{font-family:var(--display);font-weight:800;font-size:1.35rem;display:block;margin-top:8px;color:var(--blue)}
.gtile .price{display:inline-block;margin-top:8px;font-weight:800;padding:.15em .7em;border-radius:99px;background:var(--bg2)}
.gtile.poor{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.game{position:relative;margin-top:8px}
.intro{text-align:center;padding:18px 10px}
.intro .how{font-size:4.2rem;line-height:1.1;animation:introbob 1.2s ease-in-out infinite}
@keyframes introbob{50%{transform:translateY(-8px)}}
.intro .row{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;margin:22px 0}
.intro .it{position:relative;width:120px;height:120px;border-radius:22px;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font-size:3.6rem}
.intro .it img{width:100px;height:100px;object-fit:contain}
.intro .it b{position:absolute;right:-10px;top:-10px;font-size:2rem}
.intro .it.bad{border-color:var(--bad)}
.intro .it.good{border-color:var(--sea)}
.intro .de{max-width:560px;margin:0 auto 18px;font-size:1.15rem}
.intro .btns{display:flex;justify-content:center;align-items:center;gap:18px}
.intro .btns .start{margin:0}
.btn.start{display:block;margin:0 auto 34px;font-size:3rem;padding:.25em 1.4em}
.write{display:flex;gap:10px;justify-content:center;align-items:center;margin:16px 0}
.write input{font:inherit;font-size:2rem;padding:.3em .6em;border-radius:14px;border:3px solid var(--line);background:var(--surface);color:var(--ink);width:min(360px,70vw);text-align:center}
.write .art{font-size:2rem;font-weight:700}
.meter{display:block;height:12px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:12px;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--sea);border-radius:99px;transition:width .3s}

/* Lektion */
.acts{display:grid;gap:14px;margin:8px 0 28px}
.act{display:flex;align-items:center;gap:16px;padding:16px 18px}
.act .big{font-size:2.6rem;flex:none}
.act b{font-family:var(--display);font-size:1.5rem;display:block;line-height:1.1}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.word{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;width:100%}
.word:active{background:var(--bg2)}
.word .pt{display:block;font-weight:700;font-size:1.15rem;overflow-wrap:anywhere}
.word .de{display:block;font-size:.95rem;color:var(--muted)}
.word.known{border-color:var(--sea)}

/* Bilder */
.pic{display:inline-grid;place-items:center;line-height:1}
.pic.emo{font-size:var(--s,3rem)}
.pic.num{font-family:var(--display);font-weight:800;font-size:calc(var(--s,3rem)*1.05);color:var(--blue)}
.pic.img img{width:var(--s,3rem);height:var(--s,3rem);object-fit:contain;border-radius:14px;display:block;background:#fff}
.scene .media{display:block}
.scene .media img,.scene .media video{display:block;width:min(100%,calc((100dvh - 470px) * 16 / 9));min-width:min(100%,420px);margin:0 auto;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#fff}
.pic.word{font-family:var(--display);font-weight:800;font-size:calc(var(--s,3rem)*.3);line-height:1.15;color:var(--blue);padding:.2em .3em;overflow-wrap:anywhere}
.pic.num{white-space:nowrap}
.pic.blob{width:var(--s,3rem);height:var(--s,3rem);background:var(--c);border-radius:58% 42% 55% 45%/48% 60% 40% 52%;border:3px solid var(--ink)}

/* Übungen */
.track{flex:1;height:16px;border-radius:99px;background:var(--surface);border:2px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--sun);transition:width .3s}
.stage{text-align:center;padding-top:6px}
.stage .ask{font-family:var(--display);font-weight:800;font-size:1.6rem;margin-bottom:16px}
.stage .show{--s:7.5rem;margin:6px 0 4px}
.stage .ptbig{font-family:var(--display);font-weight:800;font-size:2.8rem;color:var(--blue);line-height:1.1;overflow-wrap:anywhere}
.stage .debig{font-size:1.3rem;color:var(--muted);margin-bottom:18px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.opt{--s:4.6rem;min-height:132px;display:grid;place-items:center;padding:14px;text-align:center}
.opt.txt{min-height:84px;font-family:var(--display);font-weight:800;font-size:1.55rem;overflow-wrap:anywhere}
.opt.sel{background:var(--sun);color:var(--on-sun)}
.opt.ok{background:var(--ok-bg);border-color:var(--sea);box-shadow:inset 0 0 0 5px var(--ok-bg), inset 0 0 0 7px var(--sea), 0 6px 0 var(--sea)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);box-shadow:inset 0 0 0 5px var(--bad-bg), inset 0 0 0 7px var(--bad), 0 6px 0 var(--bad);animation:shake .35s}
.opt.dim{opacity:.45}
.opt small{display:block;font:700 1.05rem var(--body);margin-top:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}
.grid3 .opt{font-size:2.6rem}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

.cloze{font-family:var(--display);font-size:1.6rem;line-height:1.5;margin:14px auto;max-width:720px;text-align:center}
.cloze .gap{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--muted);color:var(--muted);text-align:center}
.cloze mark{background:#ffe066;border-radius:6px;padding:0 4px}
.house-ex{text-align:center}
.house{position:relative;width:100%;max-width:900px;margin:12px auto;border-radius:16px;overflow:hidden;box-shadow:0 4px 0 rgba(15,31,77,.12)}
.house .bg{display:block;width:100%;height:auto}
.house .placed{position:absolute;height:auto;pointer-events:none}
.house .placed.pop{animation:drop .45s ease-out}
@keyframes drop{0%{opacity:.2;margin-top:-6%}100%{opacity:1;margin-top:0}}
.house .front{position:absolute;left:0;top:0;width:100%;height:auto;pointer-events:none}
.house .shadow{position:absolute;aspect-ratio:4/1;transform:translate(-50%,-62%);background:radial-gradient(closest-side,rgba(40,25,10,.38),rgba(40,25,10,0));pointer-events:none}
.house .glow{z-index:2;position:absolute;border:4px solid #ffd34d;background:rgba(255,224,102,.35);border-radius:10px;animation:blinkglow .45s ease-in-out 3}
@keyframes blinkglow{50%{opacity:.2}}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px;margin:10px auto;padding:10px;background:var(--card,#fff);border-radius:16px}
.tray .mov{width:72px;height:72px;object-fit:contain;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.tray .mov.wrong{animation:shake .4s 2;filter:drop-shadow(0 0 6px #e8364f) drop-shadow(0 0 2px #e8364f)}
.tray .mov.hint{animation:hintglow 1s ease-in-out infinite;border-radius:12px}
@keyframes hintglow{50%{background:rgba(255,224,102,.75);box-shadow:0 0 0 6px rgba(255,224,102,.75)}}
.dragimg{position:fixed;z-index:1000;pointer-events:none;height:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.door-ex{text-align:center}
.door{position:relative;width:100%;max-width:900px;margin:8px auto;border-radius:16px;overflow:hidden;box-shadow:0 4px 0 rgba(15,31,77,.12);aspect-ratio:16/9;background:#e8dcc8}
.door .bg{display:block;width:100%;height:100%;object-fit:cover}
.door .bg.glowsky{animation:skyglow .5s ease-in-out 3}
@keyframes skyglow{50%{filter:brightness(1.25) saturate(1.3)}}
.door .vis{position:absolute;width:auto;transform:translate(-50%,-100%);transform-origin:50% 100%;pointer-events:none}
.door .vis.in{animation:visin .8s ease-out both}
.door .vis.hop{animation:vishop .45s ease-in-out 2}
.door .vis.enter{animation:visenter 1s ease-in forwards}

.pot.sel{border-color:#1b4fa0;transform:scale(1.12)}
.testarea{margin-top:28px;padding:16px;border:2px dashed var(--muted);border-radius:16px}
.testarea h3{margin-top:0}
.testarea .pbtns{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.testarea .btn{font-size:1rem;padding:8px 12px}
.mic{position:relative;width:150px;height:150px;margin:14px auto 4px;display:flex;align-items:center;justify-content:center}
.mic i{position:absolute;inset:25px;border-radius:50%;background:rgba(255,196,0,.35);transition:transform .06s}
.mic.on i{background:rgba(255,160,0,.4);animation:grow 3s ease-out forwards}
@keyframes grow{from{transform:scale(1)}to{transform:scale(2)}}
.mic .micbtn{position:relative;z-index:1;font-size:2.4rem;background:#ffd34d;color:#0f1f4d}
.micmsg{font-family:var(--display);font-size:1.6rem;min-height:2rem;margin:4px 0 10px}
.slots{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin:20px 0}
.slots .art{font-family:var(--display);font-weight:800;font-size:1.8rem;color:var(--muted);margin-right:6px}
.slot{width:52px;height:62px;border-radius:12px;border:3px dashed var(--line);background:var(--surface);font-family:var(--display);font-weight:800;font-size:1.9rem;display:grid;place-items:center}
.slot.full{border-style:solid;border-color:var(--blue)}
.slot.fix{border:0;background:none;width:20px}
.slot.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.slot.good{border-color:var(--sea)}
.typed{font-size:2rem;font-weight:700;padding:.3em .6em;border-radius:14px;border:3px solid var(--bad);background:var(--bad-bg);letter-spacing:.04em}
.typed .wrong{color:var(--bad);text-decoration:underline wavy;text-underline-offset:6px}
.fixline{text-align:center;font-family:var(--display);font-weight:800;font-size:2rem;color:var(--sea);margin:4px 0 12px}
.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.letter{width:60px;height:64px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);font-family:var(--display);font-weight:800;font-size:1.9rem}
.letter.used{visibility:hidden}

.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  border-top:3px solid var(--sea);background:var(--ok-bg);animation:rise .18s ease-out;
}
.sheet.bad{border-color:var(--bad);background:var(--bad-bg)}
.sheet .in{max-width:728px;margin:0 auto;display:flex;align-items:center;gap:14px}
.sheet .msg{flex:1;min-width:0}
.sheet .msg b{font-family:var(--display);font-size:1.5rem;display:block;line-height:1.1}
.sheet .pic{--s:2.6rem}
@keyframes rise{from{transform:translateY(100%)}}

/* Geschichte */
.scene{text-align:center}
.scene .frame{padding:26px 18px 22px;margin-bottom:18px}
.scene .frame .emo{font-size:7rem;line-height:1.1;display:block}
.scene .line{display:block;font-family:var(--display);font-weight:600;font-size:1.9rem;line-height:1.25;margin-top:10px}
.scene .line mark{background:none;color:var(--blue);font-weight:800;border-bottom:4px solid var(--sun)}
.scene .who-says{display:inline-block;margin-top:8px;padding:.1em .8em;border-radius:99px;background:var(--sun);color:var(--on-sun);font-weight:700;font-size:1rem}
.scene .de{display:block;color:var(--muted);margin-top:10px;min-height:1.5em}
.dots{display:flex;justify-content:center;gap:7px;margin:0 0 18px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--blue)}
.ctrl{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ctrl .go-on{margin:0 0 0 14px;font-size:1.6rem;padding:.35em 1.1em}

/* Paare */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}
.pairs .opt{min-height:92px;--s:3.4rem}
.pairs .opt.txt{font-size:1.3rem}
.pairs .gone{visibility:hidden}

/* Fertig */
.done{text-align:center;padding-top:30px}
.done svg{width:170px;height:auto;animation:pop .5s ease-out}
.done .stars{font-family:var(--display);font-weight:800;font-size:3.4rem;color:var(--blue);margin:8px 0}
.done .btns{display:grid;gap:14px;max-width:420px;margin:26px auto 0}

@media (max-width:480px){
  h1{font-size:2.1rem}.hero h1{font-size:2.8rem}
  .stage .show{--s:6rem}.opt{--s:3.8rem;min-height:110px}
  .scene .frame .emo{font-size:5.4rem}.scene .line{font-size:1.5rem}
  .slot{width:42px;height:54px;font-size:1.6rem}.letter{width:52px;height:58px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(() => {

/* ---------- Inhalte ---------- */
const LESSONS = JSON.parse(document.getElementById('content').textContent).lessons;

  l.scene = { title: l.title, de: l.de, lines: l.groups.flatMap((g, gi) => g.lines.map(x => ({ ...x, e: g.e, sk: `${l.id}-${gi + 1}` }))) };
});
LESSONS.forEach(l => l.words.forEach(w => {
  w.key = (w.ref || l.id) + ':' + w.pt; // w.ref: dasselbe Wort kam schon in einer früheren Lektion vor und ist dieselbe Vokabel (ein Bild, ein Lernstand)
  w.lesson = l.id;
  w.bare = w.pt.replace(/^(os|as|o|a) /, '');
  w.art = w.pt.slice(0, w.pt.length - w.bare.length).trim();
}));
const ALL = LESSONS.flatMap(l => l.words).filter(w => !w.ref); // jede Vokabel einmal
const lessonById = id => LESSONS.find(l => l.id === id);
// Nur fertige Lektionen zeigen (alle Szenen haben ein Video); das Testprofil sieht alle
const ready = l => !!l.groups && l.groups.every((g, i) => media.videos && media.videos[`${l.id}-${i + 1}`]);
const shownLessons = () => P() && P().test ? LESSONS : LESSONS.filter(ready);
// Sätze der gerade gezeigten Szene: eine Gruppe (v.g) oder die ganze Lektion
const sceneLines = v => { const l = lessonById(v.id); return v.g == null ? l.scene.lines : l.scene.lines.filter(x => x.sk === `${l.id}-${v.g + 1}`); };
// Lernpfad: je Gruppe eine Station (Wörter und Übungen, dann ihr Video, dann ein Quiz), am Ende 🧩 Paare
const stations = l => [...l.groups.map((g, i) => ({ k: `${l.id}-${i + 1}`, g: i, e: g.e })), { k: `${l.id}-rev`, rev: true, e: '🔁' }];
// Fortschritt einer Station: w = Anteil gelernter Wörter, v = Video gesehen, q = Quiz gemacht (profil.prog)
function stationProg(l, s) {
  const p = P(), old = p.done && p.done[s.k], pr = old ? { video: true, quiz: true, done: true } : (p.prog && p.prog[s.k]) || {}; // done: Stand vom ersten Lernpfad
  if (s.rev) { const d = !!pr.done; return { total: d ? 1 : 0, done: d }; }
  const ws = l.groups[s.g].words, w = ws.filter(x => p.words[x.key]).length / ws.length;
  const v = !!pr.video, q = !!pr.quiz;
  return { w, v, q, total: (w * 6 + v + q) / 8, done: w === 1 && v && q };
}
const stationDone = (l, s) => stationProg(l, s).done;
const nextStation = l => stations(l).findIndex(s => !stationDone(l, s)); // -1: alles geschafft

/* ---------- Speicher ---------- */
const STORE = 'ola-pt-v1';
const DAY = 864e5;
const INTERVAL = [0, 1, 2, 4, 8, 16]; // Tage bis zur nächsten Wiederholung, je Stufe
let S = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    if (s && Array.isArray(s.profiles)) return s;
  } catch (e) {}
  return { profiles: [], current: null };
})();
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} };
// Alte Stände: früher hatte dasselbe Wort je Lektion einen eigenen Lernstand („lektion:wort“). Jetzt zählt der gemeinsame Schlüssel;
// war das Wort in beiden Lektionen gelernt, gilt der weiter fortgeschrittene Stand.
S.profiles.forEach(p => { if (!p.words) return; LESSONS.forEach(l => (l.words || []).forEach(w => {
  const old = l.id + ':' + w.pt, a = p.words[old]; if (!w.ref || !a) return;
  const b = p.words[w.key]; if (!b || (a.box || 0) > (b.box || 0)) p.words[w.key] = a;
  delete p.words[old];
})); });
const P = () => S.profiles.find(p => p.id === S.current);

/* ---------- Helfer ---------- */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const letterCount = w => w.bare.replace(/[^\p{L}]/gu, '').length;
let media = { bilder: {}, szenen: {}, videos: {}, icons: {}, sardinhas: {} };
// Symbol einer Lektion (key = Lektion) oder Station (key = lektion-n): erzeugtes Bild, sonst Emoji
const icon = (key, emoji) => media.icons && media.icons[key] ? `<img class="icon-img" src="${esc(media.icons[key])}" alt="">` : emoji;

}

  <path d="M34 76 Q48 90 64 78" fill="none" stroke="#0f1f4d" stroke-width="5" stroke-linecap="round"/>

/* ---------- Ton ---------- */
// Aufnahmen aus audio/ (ElevenLabs), sonst die eingebaute Stimme des Geräts.
// audio/manifest.js setzt window.OLA_AUDIO, damit es auch beim Öffnen als Datei (file://) klappt, wo fetch blockiert ist.
let manifest = (window.OLA_AUDIO && typeof window.OLA_AUDIO === 'object') ? window.OLA_AUDIO : {};

function ptVoice() {
  if (!hasTTS) return null;
  const vs = speechSynthesis.getVoices().map(v => ({ v, l: v.lang.replace('_', '-').toLowerCase() }));
  return (vs.find(x => x.l === 'pt-pt') || {}).v || null;
}
if (hasTTS) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { if (V.name === 'profiles') render(); }; } catch (e) {} }
function stopSound() {
  playId++;
  try { if (player) { player.pause(); } } catch (e) {}
  try { if (clip && clipRun) { clip.pause(); clipRun = false; } } catch (e) {}
  try { if (hasTTS) speechSynthesis.cancel(); } catch (e) {}
}
function say(text, opts = {}) {
  stopSound();
  const id = playId;
  let ended = false;
  const end = () => { if (ended || id !== playId) return; ended = true; if (opts.onend) opts.onend(); };
  const tts = () => {
    if (!hasTTS) { setTimeout(end, 900); return; }
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'pt-PT';
      const v = ptVoice(); if (v) u.voice = v;
      u.rate = opts.slow ? 0.55 : 0.85;
      u.onend = end; u.onerror = end;
      speechSynthesis.speak(u);
    } catch (e) { setTimeout(end, 900); }
  };
  const file = manifest[text];
  if (file && player) {
    try {
      player.onended = end;
      player.onerror = () => { if (id === playId) tts(); };
      player.src = 'audio/' + file;
      player.playbackRate = opts.slow ? 0.75 : 1;
      const pr = player.play();
      if (pr && pr.catch) pr.catch(() => { if (id === playId) tts(); });
    } catch (e) { tts(); }
  } else tts();
}

/* ---------- Offline-Speicher ---------- */
// Lädt die Dateien aus offline.json (vom Skript tools/veroeffentlichen.mjs) in den Cache, den sw.js benutzt.
// - Die App selbst (Seite, Spiele, Schriften: wenige MB) wird bei jedem Start aktualisiert.
// - Bilder, Töne und Videos (über 250 MB) erst, wenn Eltern das unter „Für Eltern“ einschalten (stand.__alles).
// - Rücksicht auf die Kinder: läuft ein Video, pausiert der Download; wird getippt, lädt nur eine Datei gleichzeitig.
// Geänderte Dateien (anderer Prüfwert) werden neu geholt, entfernte gelöscht.
const OFF = { text: '', ask: false, busy: false };
function setOff(s, ask) { OFF.text = s; OFF.ask = !!ask; const el = document.getElementById('offline'); if (el) el.textContent = s; const b = document.getElementById('offlineBtn'); if (b) b.hidden = !OFF.ask; }
const mb = n => (n / 1048576).toFixed(0) + ' MB';
let lastTap = 0;
addEventListener('pointerdown', () => { lastTap = Date.now(); }, true);
async function syncOffline(all) {
  if (!('serviceWorker' in navigator) || !window.caches || !window.isSecureContext) { setOff('Nur in der veröffentlichten App (https://jogrihei.github.io/ola/).'); return; }
  if (OFF.busy) return;
  OFF.busy = true;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    reg.update().catch(() => {});
    const base = new URL('./', location.href).href;
    // Der Service Worker bis Nov. 2026 lieferte beim Aktualisieren die alte Datei aus dem Speicher.
    // Der neue antwortet auf „__sw“; solange noch der alte arbeitet, werden geänderte Dateien nicht angefasst.
    let swNeu = false;
    for (let i = 0; i < 12 && !swNeu; i++) { swNeu = await fetch(base + '__sw').then(r => r.ok ? r.text() : '').then(t => t === '2').catch(() => false); if (!swNeu) await sleep(400); }
    const r = await fetch('offline.json', { cache: 'no-cache' });
    if (!r.ok) { setOff('Keine Dateiliste gefunden (nur in der veröffentlichten App).'); return; }
    const list = (await r.json()).files || {};
    const c = await caches.open('ola-dateien');
    const STAND = base + '__stand.json';
    const had = await c.match(STAND), stand = had ? await had.json() : {};
    const size = p => +list[p].split(':')[1] || 0;
    const isMedia = p => /^(audio|bilder|videos)\//.test(p);
    const tier = p => /^videos\//.test(p) ? 2 : isMedia(p) ? 1 : 0;
    const save = () => c.put(STAND, new Response(JSON.stringify(stand), { headers: { 'Content-Type': 'application/json' } }));
    // Einmalig: Gerät hatte schon Medien gespeichert -> weiter alles speichern. Dateien, die der alte
    // Service Worker „aktualisiert“ hat, können noch die alte Fassung sein: App-Dateien neu holen,
    // bei Medien die gespeicherte Größe mit der Liste vergleichen.
    if (had && !stand.__v2 && swNeu) {
      if (Object.keys(stand).filter(isMedia).length > 20) stand.__alles = 1;
      for (const p of Object.keys(stand)) {
        if (p[0] === '_' || !(p in list) || stand[p] !== list[p]) continue;
        if (!isMedia(p)) { delete stand[p]; continue; }
        const hit = await c.match(base + p), len = hit ? +hit.headers.get('Content-Length') || 0 : -1;
        if (len < 0 || (len && len !== size(p))) delete stand[p];
      }
    }
    if (swNeu || !had) stand.__v2 = 1;
    const sig = Object.keys(list).length + ':' + Object.values(list).join('').length; // Merker für „Speicher voll“
    if (all) { stand.__alles = 1; delete stand.__voll; }
    for (const p of Object.keys(stand)) if (p[0] !== '_' && !(p in list)) { await c.delete(base + p); delete stand[p]; }
    const total = Object.keys(list).reduce((s, p) => s + size(p), 0);
    const mediaOn = !!stand.__alles && !stand.__voll;
    const todo = [];
    for (const p of Object.keys(list)) {
      if (stand[p] === list[p] || (isMedia(p) && !mediaOn)) continue;
      // noch alter Service Worker: nur holen, was noch gar nicht gespeichert ist
      if (!swNeu && await c.match(base + p)) continue;
      todo.push(p);
    }
    todo.sort((a, b) => tier(a) - tier(b));
    const n = todo.length;
    let bytes = Object.keys(list).reduce((s, p) => s + (stand[p] === list[p] ? size(p) : 0), 0), done = 0, failed = 0, last = 0, full = false;
    const show = () => {
      if (full || stand.__voll) return setOff(`Der Speicher dieses Geräts reicht nicht für alles (${mb(bytes)} von ${mb(total)} gespeichert). Der Rest kommt aus dem Internet.`, true);
      if (!stand.__alles) return setOff(done + failed < n ? 'Die App wird aktualisiert …' : `Bilder, Töne und Videos kommen aus dem Internet. Für unterwegs lässt sich alles auf diesem Gerät speichern (${mb(total)}, am besten im WLAN).`, done + failed >= n);
      setOff(done + failed < n ? `Wird gespeichert: ${mb(bytes)} von ${mb(total)} …` : failed ? `${failed} Dateien fehlen noch, sie werden beim nächsten Start mit Internet geholt.` : `✅ Alles gespeichert (${mb(total)}). Die App läuft auch ohne Internet.`);
    };
    show();
    const playing = () => [...document.querySelectorAll('video')].some(v => !v.paused && !v.ended);
    const worker = async i => {
      while (todo.length && !full) {
        // Video läuft: warten. Es wird gerade getippt: nur der erste Lader arbeitet.
        while (playing() || (i > 0 && Date.now() - lastTap < 15000)) await sleep(700);
        const p = todo.shift();
        if (!p) break;
        try {
          const res = await fetch(base + p, { cache: 'reload' });
          if (!res.ok) throw new Error(res.status);
          await c.put(base + p, res);
          stand[p] = list[p]; bytes += size(p); done++;
        } catch (e) {
          failed++;
          if (e && e.name === 'QuotaExceededError') { full = true; stand.__voll = sig; }
        }
        if (Date.now() - last > 3000) { last = Date.now(); await save(); }
        show();
      }
    };
    if (mediaOn && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    await Promise.all([worker(0), worker(1), worker(2)]);
    await save(); show();
  } catch (e) { setOff('Fehler: ' + e.message); }
  finally { OFF.busy = false; if (OFF.want) { OFF.want = false; syncOffline(true); } }
}

function grade(w, ok) {
  const p = P(), old = p.words[w.key];
  if (ok) {
    const box = Math.min(5, (old ? old.box : 0) + 1);
    p.words[w.key] = { box, due: Date.now() + INTERVAL[box] * DAY };
  } else {
    p.words[w.key] = { box: 1, due: Date.now() }; // falsch: zurück auf Stufe 1 und gleich fällig (Kachel „🔁 Repetir“)
  }
}
const dueWords = () => { const p = P(), now = Date.now(); return ALL.filter(w => p.words[w.key] && p.words[w.key].due <= now); };
const learned = l => { const p = P(); return l.words.filter(w => p.words[w.key]).length; };
// Sardinen 🐟 sind die Währung (früher Sterne, die 1:1 übernommen werden). Spiele kosten GAME_PRICE.
const GAME_PRICE = 10;
const REVIEW_BONUS = 8; // Sardinen extra für eine Wiederholungsrunde von der Startseite (Aufwärmen vor ▶️: 3)
const fish = p => { if (p.fish == null) p.fish = p.stars || 0; return p.test ? '∞' : p.fish; };
function reward(n) {
  const p = P();
  fish(p);
  p.fish += n;
  const today = new Date().toDateString();
  if (p.lastDay !== today) {
    p.streak = p.lastDay === new Date(Date.now() - DAY).toDateString() ? (p.streak || 0) + 1 : 1;
    if (p.streak > 1) p.fish += 2; // Tag in Folge
    p.lastDay = today;
  }
  save();
}
function spend(n) { const p = P(); if (p.test) return true; // Testprofil: Spiele gratis
  if (fish(p) < n) return false; p.fish -= n; save(); return true; }
// Station frisch geschafft: +5; Lektion komplett: Sardine fürs Album
function finishPart(l, k, part, earned) {
  const s = stations(l).find(x => x.k === k), was = stationDone(l, s);
  markPart(k, part);
  let n = earned, sardine = null;
  if (!was && stationDone(l, s)) n += 5;
  const p = P();
  if (stations(l).every(x => stationDone(l, x)) && !(p.album && p.album[l.id])) { p.album = { ...(p.album || {}), [l.id]: true }; sardine = l.id; p.playDay = new Date().toDateString(); p.playMs = 0; } // neue Sardine + volle Spielzeit
  reward(n);
  go({ name: 'done', stars: n, back: l.id, sardine });
}

let clip = null; // bleibt beim Neuzeichnen erhalten, damit das Video nicht bei jedem Satz neu startet
let clipRun = false; // läuft gerade ein Video mit eigener Tonspur?
// Videos mit Tonspur (lippensynchron): media.zeiten[szene] = [[start, ende], …] je Satz der Szene
function syncOf(i) {
  const lines = sceneLines(V), line = lines[i];
  const z = media.zeiten && media.zeiten[line.sk];
  if (!z || !media.videos[line.sk]) return null;
  const k = lines.slice(0, i).filter(x => x.sk === line.sk).length;
  return z[k] ? { start: z[k][0], end: z[k][1] } : null;
}
// 🇩🇪-Knopf: blendet die deutschen Übersetzungen ein und aus (pro Profil gespeichert)
function deBtn() {
  const on = !!(P() && P().showDe);
  return `<button class="round ${on ? 'on' : ''}" data-act="toggleDe" aria-label="Deutsche Übersetzung ${on ? 'ausblenden' : 'zeigen'}" aria-pressed="${on}">🇩🇪</button>`;
}
function render() {
  const fn = views[V.name] || views.profiles;
  document.body.classList.toggle('de-on', !!(P() && P().showDe));
  if (V.name === 'game' && V.started) return; // laufendes Spiel nicht neu zeichnen
  app.innerHTML = fn();
  if (V.name === 'game') startGame(V);
  if (V.name === 'paint') drawPaint();
  if (V.name === 'house') bindHouse();
  const slot = document.getElementById('vid');
  if (!slot) { if (clip) { clip.pause(); clipRun = false; } return; }
  const sk = sceneLines(V)[V.i].sk, src = media.videos[sk], synced = !!(media.zeiten && media.zeiten[sk]);
  // Immer dasselbe Video-Element: Safari auf dem iPad erlaubt Ton nur Elementen, die schon einmal per Antippen liefen
  if (!clip) { clip = document.createElement('video'); clip.playsInline = true; clip.setAttribute('playsinline', ''); }
  if (clip.dataset.src !== src) {
    clip.pause(); clipRun = false;
    clip.dataset.src = src; clip.src = src;
    if (media.szenen[sk]) clip.poster = media.szenen[sk]; else clip.removeAttribute('poster'); // Standbild, bis das Video läuft
    clip.preload = 'metadata';
  }
  clip.muted = !synced; clip.loop = !synced;
  slot.appendChild(clip);
  if (synced && !clipRun) { const s = syncOf(V.i); if (s) try { clip.currentTime = s.start; } catch (e) {} return; }
  const pr = clip.play(); if (pr && pr.catch) pr.catch(() => {});
}
// Spielt einen Satz im Video mit Ton ab; cont = danach automatisch zum nächsten Satz
function playClip(v, s, cont) {
  stopSound();
  const id = playId;
  clipRun = true; clip.muted = false;
  try { clip.currentTime = s.start; } catch (e) {}
  const pr = clip.play(); if (pr && pr.catch) pr.catch(() => {});
  clip.ontimeupdate = () => {
    if (id !== playId || V !== v || !clip) return;
    if (clip.currentTime < s.end + 0.15 && !clip.ended) return;
    const lines = sceneLines(v);
    if (cont && v.playing && v.i < lines.length - 1) {
      const same = lines[v.i + 1].sk === lines[v.i].sk && syncOf(v.i + 1);
      v.i++;
      if (same) { s = same; render(); return; } // gleiches Video läuft einfach weiter
      clipRun = false; clip.pause(); render();
      setTimeout(() => { if (V === v && v.playing) playLine(); }, 450);
    } else {
      clipRun = false; clip.pause();
      if (cont) v.playing = false;
      render();
    }
  };
}

const QUINTA_IN = { lago: [[14, 42], [22, 44], [30, 41]], coop: [[62, 40], [67, 41], [72, 40]], campo: [[36, 39], [42, 40], [52, 39], [58, 40], [33, 37], [47, 37], [55, 37], [39, 37]] };
// Stellen zum Antippen, je Ort eine oder mehrere Flächen [links, oben, rechts, unten]; o campo = die gelben Getreidefelder hinten
const QUINTA_PLACES = { 'o lago': [[4, 35, 38, 48]], 'o campo': [[12, 22, 41, 33], [58, 22, 72, 31]], 'a árvore': [[42, 5, 57, 36]], 'o trator': [[82, 26, 96, 41]] };

// Veste o Pondi! (roupa): Pondi in Adas Zimmer, vor dem Fenster das Wetter (Schnee, Regen, Strand, Sonne, Nacht).
// Ada sagt „Hoje está frio! … Põe o casaco ao Pondi!“, das Kind tippt unter vier Kleidungsstücken das richtige an, dann
// wechselt das ganze Bild: Pondi trägt es (bilder/spiele/pondi-<wetter>-<n>, jedes aus dem vorigen erzeugt, feste Reihenfolge).
// Unbekannte Wörter zieht Pondi von selbst an (wie bei der Wohnung). Runden: zwei aus Kälte, Regen, Strand, Sonnentag,
// Fest (Kleid, Schuhe, Blume), zum Schluss abends der Schlafanzug. „pôr“ statt „vestir“ (Schuhe/Handschuhe wären „calçar“).
// Auswahlbilder: bilder/spiele/veste-* (nur das Kleidungsstück).
const ROUPA_ROUNDS = [
  { k: 'frio', intro: 'Hoje está frio!', seq: ['a camisola', 'o casaco', 'o cachecol', 'as luvas', 'as meias', 'as botas'] },
  { k: 'festa', base: 'sol', intro: 'Hoje há uma festa!', seq: ['o vestido', 'os sapatos', 'a flor'] },

  { k: 'sol', intro: 'Hoje está um dia bonito!', seq: ['a t-shirt', 'os calções', 'as meias', 'os ténis', 'o boné'] },
  { k: 'noite', intro: 'Já é noite. Hora de dormir!', seq: ['o pijama'] },

const VESTE_IMG = { 'a t-shirt': 't-shirt', 'as calças': 'calcas', 'o vestido': 'vestido', 'os calções': 'calcoes', 'as meias': 'meias', 'os sapatos': 'sapatos',
  'o casaco': 'casaco', 'a camisola': 'camisola', 'o cachecol': 'cachecol', 'as luvas': 'luva', 'o chapéu': 'chapeu', 'as botas': 'botas', 'os ténis': 'tenis',
  'os óculos': 'oculos', 'o guarda-chuva': 'guarda-chuva', 'o boné': 'bone', 'o pijama': 'pijama', 'os óculos de sol': 'oculos-de-sol', 'o fato de banho': 'fato-de-banho',
  'os chinelos': 'chinelos', 'o lenço': 'lenco', 'a flor': 'flor' };
const ROUPA_ALL = Object.keys(VESTE_IMG);
const vesteSrc = w => B_SPRITE('veste-' + VESTE_IMG[w]);
const roupaCmd = w => w === 'o guarda-chuva' ? `Dá ${w} ao Pondi!` : `Põe ${w} ao Pondi!`;
// Bild für Wetter k mit n angezogenen Stücken (0 = noch nichts an)
const roupaPic = (r, n) => B_SPRITE(n ? `pondi-${r.k}-${n}` : `quarto-${r.base || r.k}`);
function startRoupa(id) {
  const ok = ROUPA_ROUNDS.filter(r => r.seq.filter(knowsWord).length >= (r.k === 'noite' ? 1 : 2));

  const rounds = shuffle(ok.filter(r => r.k !== 'noite')).slice(0, night ? 2 : 3);

      // Bild vorher: alle Stücke bis vor diesem (unbekannte davor trägt Pondi schon); nachher: bis zum nächsten bekannten
      const at = r.seq.indexOf(w), next = j + 1 < known.length ? r.seq.indexOf(known[j + 1]) : r.seq.length;
      tasks.push({ r: ri, w, before: at, after: next, first: j === 0, last: j === known.length - 1, opts: shuffle([w, ...others]) });

// O monstro (corpo): Selma und Pandi bauen ein lustiges Monster. Selma sagt „O monstro tem três olhos!“, das Kind tippt
// das richtige Teil so oft an (jedes Antippen zählt laut mit), ✅ = fertig; ein Teil im Monster antippen = wieder weg.
// Weibliche Teile (orelhas, pernas) nur mit Zahlen ab drei, damit nur gelernte Formen vorkommen (nicht uma/duas).
// Am Ende tanzt das Monster, Pandi tanzt mit. Bilder: bilder/spiele/monstro-*, pandi-aponta, gast-selma. Sätze: saetze-extra.json (corpo).
// Lage im Monster (% der Monsterfläche; der Körper reicht x 22–78 %, y 20–88 %): Plätze je Teil [x, y], Breite, gespiegelt rechts/links
const MONSTRO = [
  { id: 'olho', w: 'os olhos', n: [1, 2, 3, 4, 5], wd: 12, pos: [[42, 38], [58, 38], [50, 28], [37, 31], [63, 31]],
    txt: n => n === 1 ? 'O monstro tem um olho!' : `O monstro tem ${numWord(n)} olhos!` },
  { id: 'nariz', w: 'o nariz', n: [1, 2], wd: 11, pos: [[50, 49], [50, 57]], txt: n => n === 1 ? 'O monstro tem um nariz!' : 'O monstro tem dois narizes!' },
  { id: 'boca', w: 'a boca', n: [1], wd: 28, pos: [[50, 68]], txt: () => 'O monstro tem uma boca grande!' },
  { id: 'orelha', w: 'as orelhas', n: [3, 4], wd: 11, pos: [[37, 18], [63, 18], [29, 26], [71, 26]], flipRight: true, txt: n => `O monstro tem ${numWord(n)} orelhas!` },
  { id: 'braco', w: 'o braço', n: [1, 2, 3, 4], wd: 24, pos: [[83, 57], [17, 57], [84, 71], [16, 71]], flipLeft: true,

      if (v.n >= v.tasks.length) { v.done = true; v.dance = true; render(); sfx('confetti'); say('O monstro dança!', { onend: () => { if (V === v) say('Que monstro tão engraçado!'); } }); }

const LISTA = { 'a maçã': ['maca', 'maçãs'], 'a banana': ['banana', 'bananas'], 'a laranja': ['laranja', 'laranjas'], 'o morango': ['morango', 'morangos'],

function startLista(id) {
  const known = shuffle(Object.keys(LISTA).filter(knowsWord)), locked = known.length < 4, tasks = [];
  // Regal: sechs Plätze je Brett, jedes Brett mittig gefüllt; eigens gemischt, damit Avó nicht der Reihe nach durchs Regal fragt
  const shelf = shuffle(known.slice()).map((w, i) => { const row = Math.floor(i / 6), inRow = Math.min(6, known.length - row * 6); return { w, x: 65 + (i % 6 - (inRow - 1) / 2) * 10.4, y: LISTA_Y[row] }; });

    const pk = shuffle(Object.keys(LISTA_PRECO).filter(knowsWord)), precos = [];
    if (knowsWord('barato') && knowsWord('caro') && pk.length >= 2) {
      const caro = Math.random() < 0.5;
      [[pk[0], pk[1], caro], [pk[2] || pk[1], pk[3] || pk[0], !caro]].forEach(([a, b, c]) => {

        const r = c ? a : b, p = LISTA_PRECO[r];

    }

function listaAsk() { const t = V.tasks && V.tasks[V.n]; if (t) say(t.q); }
function listaMiss(v, what) { v.wrong = what; v.miss++; if (v.miss >= 2) v.glow = true; sfx('honk'); render();
  setTimeout(() => { if (V === v) { v.wrong = null; render(); } }, 700);
  setTimeout(() => { if (V === v && !v.busy) listaAsk(); }, 750); }
function listaRight() {
  const v = V, t = v.tasks[v.n]; v.busy = true; v.hit = true; v.glow = false; v.wrong = null; v.stars += v.miss ? 0 : 1; v.miss = 0; sfx('collect'); render();
  let open = 2, fired = false;
  const next = () => { if (fired || V !== v) return; fired = true; v.hit = false; if (t.kind === 'lista') v.got.push(t.w); v.n++;
    if (v.n >= v.tasks.length) { v.done = true; render(); sfx('confetti'); say(LISTA_FIM); }

  checkWrite() {
    const st = cur(), el = document.getElementById('wr');
    if (st.result || !el) return;
    const val = el.value.trim().replace(/\s+/g, ' ');

    // nur Buchstaben vergleichen: Groß/klein, Satzzeichen (iPad: zweimal Leertaste = Punkt), Bindestriche

    const want = letters(st.w.bare), got = letters(val), art = letters(st.w.art || '');

  toggleDe() { const p = P(); if (!p) return; p.showDe = !p.showDe; save(); render(); },
  quizStart() { startQuiz(); },
  quizReplay() { say(V.qs[V.qi].line.pt); },
  quizPick(i) {
    const q = V.qs[V.qi]; if (q.result) return;
    q.picked = +i; q.result = q.opts[+i] === q.line ? 'ok' : 'bad';
    if (q.result === 'ok') V.stars++;
    render(); say(q.line.pt);
  },
  quizNext() {
    if (++V.qi >= V.qs.length) {
      const n = V.stars + 2, id = V.id;
      P().scenes[id] = true; reward(n);
      return go({ name: 'done', stars: n, back: id });
    }
    stopSound(); render(); say(V.qs[V.qi].line.pt);
  },
  pairs(id) { startPairs(id); },
  pairA(i) { if (V.gone[V.left[+i].key]) return; V.a = +i; V.miss = null; pairCheck(); },
  pairB(i) { if (V.gone[V.right[+i].key]) return; V.b = +i; V.miss = null; say(V.right[+i].pt); pairCheck(); }
};
function runStation(lid, i) {
  const l = lessonById(lid), s = stations(l)[i];
  if (!s) { go({ name: 'lesson', id: lid }); startLearn(l.id); return autoplay(); } // alles geschafft: üben
  const p = P();
  const pos = getAt(s.k); // gemerkte Stelle in dieser Station
  if (s.rev) {
    if (pos && pos.kind === 'sess' && resumeSess(l.id, pos, { rev: true, k: s.k })) return;
    startSession([], shuffle(l.words.slice()), l.id, { rev: true, k: s.k }); return autoplay();
  }
  const pr = stationProg(l, s), at = { g: s.g, k: s.k };
  // dort weitermachen, wo das Kind aufgehört hat (Aufgabe, Satz im Video, Quizfrage); eine fertige Station wird ganz wiederholt
  if (pr.w === 1 && !pr.v) {
    const n = sceneLines({ id: l.id, g: s.g }).length;
    return go({ name: 'scene', id: l.id, ...at, i: pos && pos.kind === 'scene' ? Math.min(pos.i, n - 1) : 0, playing: false, slow: false });
  }
  if (pr.w === 1 && pr.v && !pr.q) return startGroupQuiz(l.id, at, pos);
  if (pos && pos.kind === 'sess' && resumeSess(l.id, pos, at)) return;
  const g = l.groups[s.g], fresh = g.words.filter(w => !p.words[w.key]);
  startSession(fresh, fresh.length ? [] : shuffle(g.words.slice()), l.id, at);
  autoplay();
}
function markPart(k, part) { const p = P(); p.prog = p.prog || {}; p.prog[k] = { ...(p.prog[k] || {}), [part]: true }; save(); }
function keepName() { const el = document.getElementById('nm'); if (el) V.pname = el.value; }

document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'wr') { e.preventDefault(); acts.checkWrite(); } });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t && V && V.name === 'creche' && e.target.closest('#wimmel')) { crecheMiss(e); return; }
  if (!t || t.disabled) return;
  const fn = acts[t.dataset.act];
  if (fn) fn(t.dataset.arg, t);
});

render();
})();
</script>
